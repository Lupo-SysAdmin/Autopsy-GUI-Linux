name: Build and validate experimental DEB
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t autopsy-gui-builder -f packaging/Dockerfile .
      - name: Build package locally for validation
        run: docker run --rm -v "$PWD:/work" autopsy-gui-builder
      - name: Validate Ubuntu, Kali and Parrot
        shell: bash
        run: |
          status=0
          for distro in ubuntu kali parrot; do
            case "$distro" in
              ubuntu) image=ubuntu:24.04 ;;
              kali) image=kalilinux/kali-rolling:latest ;;
              parrot) image=parrotsec/core:latest ;;
            esac
            mkdir -p "results/$distro"
            docker pull "$image"
            docker image inspect "$image" > "results/$distro/image.json"
            docker run --name "autopsy-qa-$distro" --shm-size=1g \
              -v "$PWD:/src:ro" -v "$PWD/dist:/artifacts:ro" \
              -v "$PWD/results/$distro:/results" \
              "$image" bash /src/tests/container-qa.sh || status=1
            docker cp "autopsy-qa-$distro:/work/build/gui-regression" "results/$distro/gui-diagnostics" || true
            docker rm "autopsy-qa-$distro"
          done
          exit "$status"
      # No binary artifacts are published while the redistribution review is open.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopsy-qa-evidence
          path: |
            results/*/lifecycle.log
            results/*/image.json
            results/*/packages.tsv
            results/*/PASS
            results/*/gui-diagnostics/*.log
            results/*/gui-diagnostics/*.png
            results/*/gui-diagnostics/PASS
